<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HLD Prep Tracker</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <h1>HLD Prep Tracker</h1>
  </div>
  <div class="topbar-right">
    <span id="last-updated"></span>
    <button id="refresh-btn" class="btn btn-ghost">Refresh</button>
    <button id="theme-toggle" class="btn btn-ghost" title="Toggle dark mode">&#9789;</button>
  </div>
</header>

<div id="summary-bar" class="summary-bar"></div>

<nav class="tabs">
  <button class="tab-btn active" data-tab="systems">Systems</button>
  <button class="tab-btn" data-tab="concepts">Concepts</button>
</nav>

<div class="layout">
  <main class="main-col">
    <section id="tab-systems" class="tab-panel active">
      <div class="controls">
        <label>Status
          <select id="filter-status"><option value="">All</option></select>
        </label>
        <label>Label
          <select id="filter-label"><option value="">All</option></select>
        </label>
        <label>Sort
          <select id="sort-systems">
            <option value="grouping">Grouping</option>
            <option value="sections_complete">Sections complete</option>
            <option value="last_session">Last session</option>
          </select>
        </label>
      </div>
      <div id="systems-groups"></div>
    </section>

    <section id="tab-concepts" class="tab-panel">
      <div class="controls">
        <label>Sort
          <select id="sort-concepts">
            <option value="freshness">Freshness (stale first)</option>
            <option value="last_reviewed">Last reviewed</option>
            <option value="concept_name">Name</option>
          </select>
        </label>
      </div>
      <div id="concepts-list" class="card-list"></div>
    </section>
  </main>

  <aside class="sidebar">
    <h3>Recent Sessions</h3>
    <div id="sessions-list" class="sessions-list"></div>
  </aside>
</div>

<script src="/static/app.js"></script>
</body>
</html>
